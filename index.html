<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>FocusLab - Black Liquid Glass</title>
    <meta name="description" content="Black Liquid Glass estetiğinde minimalist odak, akışkan görevler, takvim ve etüt platformu." />
    <meta property="og:title" content="FocusLab - Black Liquid Glass" />
    <meta property="og:description" content="Black Liquid Glass estetiğinde minimalist odak, akışkan görevler, takvim ve etüt platformu." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;500;800&display=swap" rel="stylesheet" />
    <script>
      if (window.chrome) {
        document.documentElement.classList.add('chrome');
      }
    </script>
  </head>
  <body class="bg-[#030304] text-[#f2f4fa] antialiased selection:bg-[#4de1d2]/30 selection:text-white">
    <!-- SVG Refraction Filter for Liquid Glass Displacement -->
    <svg width="0" height="0" style="position:absolute; pointer-events:none;" aria-hidden="true">
      <filter id="lg" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="4" result="n" />
        <feGaussianBlur in="n" stdDeviation="3" result="nb" />
        <feDisplacementMap in="SourceGraphic" in2="nb" scale="38" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
